name: Username and authentication tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  username-auth:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: spoodle_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-only-spoodlespace-username-auth-test-key
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/spoodle_test
      CLOUDINARY_URL: cloudinary://ci-key:ci-secret@ci-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install locked application dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify registration, username changes and cookie authentication
        run: python manage.py test spoodle_space --verbosity 2
